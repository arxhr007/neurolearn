server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy the API on the same origin, so the browser never makes a
    # cross-origin request and CORS never comes into play.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tutor answers and Gemini TTS regularly take longer than nginx's
        # 60s default, which would otherwise surface as a 504 mid-lesson.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Audio responses are large base64 payloads; don't buffer them to disk.
        proxy_buffering off;
        client_max_body_size 25m;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path must return index.html, or a
    # refresh on /student/chat would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

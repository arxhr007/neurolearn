# NeuroLearn — full stack.
#
#   docker compose up --build
#
# Then open http://localhost:3000 (web) — the API is on http://localhost:8000.
# Copy .env.example to .env and set GROQ_API_KEY first, or the tutor endpoints
# return 503 while the rest of the app still runs.

services:
  backend:
    build:
      context: ./backend
    image: neurolearn-backend
    container_name: neurolearn-backend
    env_file:
      - path: .env
        required: false
    environment:
      # The web container reaches the API through nginx on its own origin, so
      # no browser request is ever cross-origin. These stay for anyone hitting
      # port 8000 directly during development.
      CORS_ORIGINS_RAW: "http://localhost:3000,http://localhost:5173,http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      # SQLite databases and the Chroma index live on the host so they survive
      # `docker compose down`.
      - ./backend/data:/app/data
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/checkpoints:/app/checkpoints
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: neurolearn-frontend
    container_name: neurolearn-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
